# Daily Kalshi combo (multivariate) collections as served, 07:40 UTC, after
# settlements-daily (07:10). Files go to R2 under record/; only the run
# records are committed.
name: combos-daily
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger-commit
  cancel-in-progress: false
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: echo "RUN_LOG_NAME=combos" >> "$GITHUB_ENV"
      - run: python collectors/kalshi_combos.py || true
      - name: Store the record (R2 when configured)
        id: store
        run: |
          if [ -n "$R2_ACCOUNT_ID" ]; then pip install -q boto3; fi
          set +e
          python collectors/store.py record
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then exit 1; fi
      - name: Keep the run as an artifact (R2 not configured)
        if: steps.store.outputs.rc == '3'
        uses: actions/upload-artifact@v4
        with:
          name: record-${{ github.workflow }}-${{ github.run_id }}
          path: record/
          retention-days: 90
          compression-level: 0
      - name: Commit run records
        run: |
          git config user.name "paddock-ledger[bot]"
          git config user.email "hello@paddock.finance"
          git add data/runs/
          git diff --cached --quiet && exit 0
          git commit -m "runs: $(date -u +%Y-%m-%d) combos"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 15; done; echo "push failed after 5 tries"; exit 1
