# Reads the last 24 hours of run records and opens an issue when an hour is
# missing, a source was unavailable, or books are still going to artifacts.
name: health-daily
on:
  schedule:
    - cron: "15 8 * * *"
    # 14:20 UTC so the week-folder-missing check (fires only after 14:00) can run
    - cron: "20 14 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collectors/health.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
