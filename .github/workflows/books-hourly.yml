# The order books, every hour: Kalshi, Gemini, Polymarket US.
# Each collector writes one gzipped JSONL file per platform per hour under
# books/. The files go to Cloudflare R2 when the four R2_* secrets are set;
# until then the hour is kept as a workflow artifact (90 days) and the run
# record says so. The run records (data/runs/) are committed either way, so a
# missing hour is visible in git.
name: books-hourly
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger-commit
  cancel-in-progress: false
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kalshi
        run: python collectors/kalshi.py --mode hourly || true
      - name: Gemini
        run: python collectors/gemini.py --mode hourly || true
      - name: Polymarket US
        run: python collectors/polymarket_us.py --mode hourly || true
      - name: Store (R2 when configured)
        id: store
        run: |
          if [ -n "$R2_ACCOUNT_ID" ]; then pip install -q boto3; fi
          set +e
          python collectors/store.py books
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then exit 1; fi
      - name: Keep the hour as an artifact (R2 not configured)
        if: steps.store.outputs.rc == '3'
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ github.run_id }}
          path: books/
          retention-days: 90
          compression-level: 0
      - name: Commit run records
        run: |
          git config user.name "paddock-ledger[bot]"
          git config user.email "hello@paddock.finance"
          git add data/runs/
          git diff --cached --quiet && exit 0
          git commit -m "runs: $(date -u +%Y-%m-%dT%HZ) books"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 15; done
