# Daily listings snapshot per platform (full metadata, committed to git),
# 05:40 UTC, before the CFTC run.
name: listings-daily
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger-commit
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: echo "RUN_LOG_NAME=listings" >> "$GITHUB_ENV"
      - run: python collectors/kalshi.py --mode daily || true
      - run: python collectors/gemini.py --mode daily || true
      - run: python collectors/polymarket_us.py --mode daily || true
      - name: Commit
        run: |
          git config user.name "paddock-ledger[bot]"
          git config user.email "hello@paddock.finance"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "listings: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 15; done; echo "push failed after 5 tries"; exit 1
